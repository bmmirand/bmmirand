<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin Miranda</title>
    <style>
        body {
            background-color: #f76900;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #002d72;
            font-size: 3em;
            margin-bottom: 20px;
        }

        img {
            width: 200px;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .about-label {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffffff;
            margin-top: 25px;
        }

        .bio {
            font-size: 1.1em;
            line-height: 1.6;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Benjamin Miranda</h1>
        <img src="me.jpeg" alt="Portrait photo of Benjamin Miranda">
        <div class="about-label">About Me</div>
        <p class="bio">
            Hi, I'm Benjamin, a student studying technology.<br>
            I enjoy learning new things and exploring the outdoors.<br>
            Thanks for visiting my page!
        </p>
    </div>
</body>
</html>
